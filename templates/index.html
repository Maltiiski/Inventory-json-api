<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inventory Tracker</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header class="app-header">
            <h1>Inventory Tracker</h1>
            <p>Track your inventory with ease</p>
        </header>

        <main class="dashboard">
            <section class="panel form">
                <h2>Add Item</h2>
                <form id="add-item-form">
                    <input type="text" id="item-name" placeholder="Item Name (Example: Cocaine)" required>
                    <input type="number" id="item-qty" placeholder="Quantity">
                    <input type="text" id="item-owner" placeholder="Owner">
                    <select id="item-value">
                        <option value="Cheap">Cheap</option>
                        <option value="Mid" selected>Mid</option>
                        <option value="Expensive">Expensive</option>
                    </select>
                    <button type="submit" id="btn-submit">Add Item</button>
                </form>
            </section>

            <section class="panel listing">
                <h2>Your Listed Items</h2>
                    <div id="item-list">
                        
                    </div>
            </section>
        </main>


        <script src="{{ url_for('static', filename='main.js') }}"></script>
    </body>
</html>
