<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inventory Tracker</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header class="app-header">
            <h1>Inventory Tracker</h1>
            <p>Track your inventory with ease</p>
        </header>

        <main class="dashboard">
            <section class="inventory-form">
                <h2>Add Item</h2>
                <form id="add-item-form">
                    <input type="text" id="item-name" placeholder="Item Name (Example: Cocaine)" required>
                    <div class="form-row">
                        <input type="number" id="item-qty" placeholder="1" required>
                        <input type="text" id="item-owner" placeholder="Owner" required>
                        <select id="value">
                            <option value="Low">Cheap</option>
                            <option value="Medium" selected>Mid</option>
                            <option value="High">Expensive</option>
                        </select>
                        <input type="date" id="date-listed">
                    </div>
                    <button type="submit" class="btn-submit">Add Item</button>
                </form>
            </section>
        </main>


        <script src="{{ url_for('static', filename='main.js') }}"></script>
    </body>
</html>
